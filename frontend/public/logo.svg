<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Monkey face -->
  <defs>
    <linearGradient id="faceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#6B21A8"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#EAB308"/>
    </linearGradient>
  </defs>
  
  <!-- Ears -->
  <circle cx="40" cy="95" r="28" fill="#9333EA"/>
  <circle cx="40" cy="95" r="18" fill="#C084FC"/>
  <circle cx="160" cy="95" r="28" fill="#9333EA"/>
  <circle cx="160" cy="95" r="18" fill="#C084FC"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="105" rx="68" ry="72" fill="url(#faceGrad)"/>
  
  <!-- Hair/Top -->
  <path d="M55 50 Q70 15 100 20 Q130 15 145 50 Q140 35 100 30 Q60 35 55 50Z" fill="#581C87"/>
  
  <!-- Face area -->
  <ellipse cx="100" cy="125" rx="42" ry="35" fill="#C084FC" opacity="0.5"/>
  
  <!-- Sunglasses bridge -->
  <rect x="88" y="88" width="24" height="6" rx="3" fill="#F59E0B"/>
  
  <!-- Left lens -->
  <ellipse cx="72" cy="92" rx="28" ry="22" fill="url(#glassGrad)" opacity="0.9"/>
  <ellipse cx="72" cy="92" rx="28" ry="22" fill="none" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="72" cy="90" rx="20" ry="14" fill="#FBBF24" opacity="0.3"/>
  
  <!-- Right lens -->
  <ellipse cx="128" cy="92" rx="28" ry="22" fill="url(#glassGrad)" opacity="0.9"/>
  <ellipse cx="128" cy="92" rx="28" ry="22" fill="none" stroke="#D97706" stroke-width="3"/>
  <ellipse cx="128" cy="90" rx="20" ry="14" fill="#FBBF24" opacity="0.3"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="120" rx="8" ry="5" fill="#581C87"/>
  
  <!-- Smile -->
  <path d="M78 135 Q100 155 122 135" fill="none" stroke="#581C87" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Nostrils -->
  <circle cx="95" cy="119" r="2.5" fill="#4C1D95"/>
  <circle cx="105" cy="119" r="2.5" fill="#4C1D95"/>
</svg>