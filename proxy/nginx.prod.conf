# ============================================================
# 3Monks — Nginx Reverse Proxy with HTTPS (Let's Encrypt)
# ============================================================

# --- Redirect HTTP → HTTPS (and handle ACME challenges) ---
server {
    listen 80;
    server_name 3monks.co.in www.3monks.co.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://3monks.co.in$request_uri;
    }
}

# --- Redirect www → non-www over HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name www.3monks.co.in;

    ssl_certificate     /etc/letsencrypt/live/3monks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3monks.co.in/privkey.pem;

    return 301 https://3monks.co.in$request_uri;
}

# --- Main HTTPS server ---
server {
    listen 443 ssl;
    http2 on;
    server_name 3monks.co.in;

    # --- SSL certificates ---
    ssl_certificate     /etc/letsencrypt/live/3monks.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/3monks.co.in/privkey.pem;

    # --- SSL hardening ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- HSTS (Strict Transport Security) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- Security headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Upload size (match Spring Boot 5MB) ---
    client_max_body_size 5M;

    # --- Proxy to backend API ---
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }

    # --- Proxy to frontend ---
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Gzip compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
