server:
  port: 8080

spring:
  application:
    name: 3monks-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:threemonks}
    username: ${DB_USERNAME:threemonks}
    password: ${DB_PASSWORD:threemonks123}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Kolkata

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:3monks.official@gmail.com}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET:3MonksSecretKeyForJWTTokenGeneration2024VeryLongSecretKey123456789}
    expiration-ms: 86400000 # 24 hours

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}

  default-admin:
    username: admin
    password: ${ADMIN_PASSWORD:admin123}
    email: admin@3monks.com

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.threemonks: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
