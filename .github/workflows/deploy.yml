# ==========================================================
# 3Monks — Deploy to AWS Lightsail
# ==========================================================
# Builds and deploys the full stack (Postgres + Spring Boot + React/Nginx)
# on an AWS Lightsail instance via Docker Compose.
#
# Required GitHub Secrets:
#   LIGHTSAIL_HOST      — Public IP or hostname of the Lightsail instance
#   LIGHTSAIL_USER      — SSH username (usually "ubuntu")
#   LIGHTSAIL_SSH_KEY   — Private SSH key (PEM) for the instance
#   DB_PASSWORD         — PostgreSQL password
#   JWT_SECRET          — JWT signing secret
#   CORS_ORIGINS        — Allowed CORS origins (e.g. http://YOUR_IP)
# ==========================================================

name: Deploy to AWS Lightsail

on:
  push:
    branches: [dev]
  workflow_dispatch:                       # Allow manual trigger

env:
  APP_DIR: /opt/threemonks

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Setup SSH agent ───────────────────────────────
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LIGHTSAIL_SSH_KEY }}

      - name: Disable host key checking
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking no" >> ~/.ssh/config
          echo "UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 644 ~/.ssh/config

      # ── 2.5. Verify port 22 connectivity ─────────────────
      - name: Check SSH port connectivity
        run: |
          echo "Testing TCP connectivity to ${{ secrets.LIGHTSAIL_HOST }}:22..."
          for i in 1 2 3 4 5; do
            if nc -z -w 5 ${{ secrets.LIGHTSAIL_HOST }} 22 2>/dev/null; then
              echo "✓ Port 22 is reachable"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "✗ Cannot reach ${{ secrets.LIGHTSAIL_HOST }}:22 after 5 attempts"
          echo "Check that port 22 (SSH) is open in Lightsail Networking firewall"
          exit 1

      - name: Test SSH authentication
        run: |
          echo "Testing SSH authentication..."
          ssh -v ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "echo '✓ SSH connection successful' && whoami"

      # ── 3. Copy project files to Lightsail ───────────────
      - name: Copy files to server
        run: |
          # Ensure target directory exists
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} \
            "sudo mkdir -p ${{ env.APP_DIR }} && sudo chown ${{ secrets.LIGHTSAIL_USER }}:${{ secrets.LIGHTSAIL_USER }} ${{ env.APP_DIR }}"

          # Rsync project files
          rsync -avz --delete \
            --include='backend/***' \
            --include='frontend/***' \
            --include='docker-compose.prod.yml' \
            --exclude='*' \
            ./ ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }}:${{ env.APP_DIR }}/

      # ── 4. Build & start containers on the server ────────
      - name: Build and deploy
        run: |
          # Write .env file on server
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "\
            cd /opt/threemonks && \
            printf 'DB_NAME=threemonks\nDB_USERNAME=postgres\nDB_PASSWORD=${{ secrets.DB_PASSWORD }}\nJWT_SECRET=${{ secrets.JWT_SECRET }}\nCORS_ORIGINS=${{ secrets.CORS_ORIGINS }}\n' > .env && \
            echo '▶ Building and starting containers...' && \
            docker compose -f docker-compose.prod.yml up -d --build && \
            docker image prune -f && \
            echo '' && \
            echo 'Deployment complete!' && \
            docker compose -f docker-compose.prod.yml ps"

      # ── 5. Health check ──────────────────────────────────
      - name: Health check
        run: |
          echo "Waiting 30s for services to start..."
          sleep 30
          ssh ${{ secrets.LIGHTSAIL_USER }}@${{ secrets.LIGHTSAIL_HOST }} "
            HTTP_STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost || echo '000')
            if [ \"\$HTTP_STATUS\" = '200' ]; then
              echo '✓ Frontend is up (HTTP '\$HTTP_STATUS')'
            else
              echo '✗ Frontend returned HTTP '\$HTTP_STATUS
              docker compose -f /opt/threemonks/docker-compose.prod.yml logs --tail=30 frontend
              exit 1
            fi
            API_STATUS=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/auth/health 2>/dev/null || echo '000')
            if [ \"\$API_STATUS\" = '200' ] || [ \"\$API_STATUS\" = '404' ]; then
              echo '✓ Backend is reachable (HTTP '\$API_STATUS')'
            else
              echo '⚠ Backend returned HTTP '\$API_STATUS
              docker compose -f /opt/threemonks/docker-compose.prod.yml logs --tail=30 backend
            fi
          "
